name: Release

# Manual release: builds the Firefox and Chrome packages for the version in
# package.json and publishes them as a GitHub release (tag = version, e.g. 1.3.5).
# If the release already exists, only its zip files are (re)uploaded.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (default: the branch the workflow runs on)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - name: Build Firefox
        run: node scripts/build.js firefox
      - name: Build Chrome
        run: node scripts/build.js chrome
      - name: Read version and release notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Release notes = the CHANGELOG section of this version
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          echo "Release notes for $VERSION:"
          cat release-notes.md
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" web-ext-artifacts/*.zip --clobber
          else
            gh release create "$VERSION" web-ext-artifacts/*.zip \
              --target "$(git rev-parse HEAD)" \
              --title "v$VERSION" \
              --notes-file release-notes.md
          fi
